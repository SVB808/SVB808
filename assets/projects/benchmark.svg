<svg xmlns="http://www.w3.org/2000/svg" width="540" height="330" viewBox="0 0 540 330" role="img" aria-labelledby="title"><title id="title">Published API benchmark. Median Decisions latency 126.84 ms; Responses 1468.97 ms. Exploratory workflow comparison.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f33"/><stop offset="1" stop-color="#09131f"/></linearGradient></defs><rect width="540" height="330" rx="18" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="35" font-size="13" fill="#5eead4" font-weight="700" letter-spacing="1.4">02 / API WORKFLOW BENCHMARK</text><text x="26" y="78" font-size="27" fill="#edf4fc" font-weight="700" >Measure the trade-offs.</text><text x="26" y="108" font-size="15" fill="#a5b6cc" font-weight="400" >Median latency · milliseconds · lower is better</text><text x="26" y="165" font-size="17" fill="#edf4fc" font-weight="500" >Decisions</text><rect x="154" y="144" width="338" height="30" rx="5" fill="#16273d"/><rect x="154" y="144" width="28.5813" height="30" rx="5" fill="#5eead4"/><text x="192.58128" y="165" font-size="15" fill="#edf4fc" font-weight="600" >126.84</text><text x="26" y="227" font-size="17" fill="#edf4fc" font-weight="500" >Responses</text><rect x="154" y="206" width="338" height="30" rx="5" fill="#16273d"/><rect x="154" y="206" width="331.0079" height="30" rx="5" fill="#86baff"/><text x="480" y="227" font-size="15" fill="#09131f" font-weight="700" text-anchor="end">1,468.97</text><text x="26" y="277" font-size="13" fill="#a5b6cc" font-weight="400" >200 calls / workflow · 40 scenarios × 5 paraphrases</text><text x="26" y="306" font-size="12" fill="#7d96af" font-weight="400" >Published experiment · Oct 2026 · exploratory results</text></g></svg>
